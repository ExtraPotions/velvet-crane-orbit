name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Verify script version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's#^// @version[[:space:]]+(.+)$#\1#p' amazon-dark-pattern-blocker.user.js | head -n1)"
          test "$version" = "$tag"

      # Publish these verified files using the ExtraPotions account after this run passes.
      - name: Package release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            amazon-dark-pattern-blocker.user.js
            icon.png
            icon-64.png
            icon-128.png
            badge.svg
