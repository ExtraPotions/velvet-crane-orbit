name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Verify script version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's#^// @version[[:space:]]+(.+)$#\1#p' amazon-dark-pattern-blocker.user.js | head -n1)"
          test "$version" = "$tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            amazon-dark-pattern-blocker.user.js
            icon.png
            icon-64.png
            icon-128.png
