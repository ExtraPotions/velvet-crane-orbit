name: Prepare 0.1.32

on:
  push:
    branches:
      - release/0.1.32-ui-settings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 0.1.32 changes
        shell: python
        run: |
          from pathlib import Path

          script = Path('amazon-dark-pattern-blocker.user.js')
          text = script.read_text()

          replacements = [
              ('// @version        0.1.31', '// @version        0.1.32'),
              ('displayName: "Remove urgency tactics",\n      default: true,', 'displayName: "Remove urgency tactics",\n      default: false,'),
              ('displayName: "Remove Subscribe & Save nudges",\n      default: true,', 'displayName: "Remove Subscribe & Save nudges",\n      default: false,'),
              ('displayName: "Remove FBT / carousels",\n      default: true,', 'displayName: "Remove recommendation carousels",\n      default: false,'),
              ('/* Amazon Dark Pattern Blocker 0.1.31 - FOUC prevention (cart-rail safe) */', '/* Amazon Dark Pattern Blocker 0.1.32 - FOUC prevention (cart-rail safe) */'),
              ('border-radius: 999px !important;', 'border-radius: 12px !important;'),
              ('''#${this.PANEL_ID} .adpb-switch-input {\n  position: absolute !important; opacity: 0 !important; width: 0 !important; height: 0 !important; pointer-events: none !important;\n}\n#${this.PANEL_ID} .adpb-toggle {\n  position: relative !important; flex: none !important;\n  width: 36px !important; height: 18px !important;\n  background: #6b6b6b !important; border: 0 !important; border-radius: 12px !important;\n  cursor: pointer !important; box-sizing: border-box !important;\n  transition: background .15s ease !important;\n}''', '''#${this.PANEL_ID} .adpb-switch-control {\n  position: relative !important;\n  flex: none !important;\n  width: 36px !important;\n  height: 18px !important;\n}\n#${this.PANEL_ID} .adpb-switch-input {\n  position: absolute !important;\n  inset: 0 !important;\n  width: 36px !important;\n  height: 18px !important;\n  margin: 0 !important;\n  padding: 0 !important;\n  opacity: 0 !important;\n  cursor: pointer !important;\n  pointer-events: auto !important;\n  z-index: 2 !important;\n}\n#${this.PANEL_ID} .adpb-toggle {\n  position: absolute !important;\n  inset: 0 !important;\n  width: 36px !important;\n  height: 18px !important;\n  background: #6b6b6b !important;\n  border: 0 !important;\n  border-radius: 12px !important;\n  cursor: pointer !important;\n  box-sizing: border-box !important;\n  pointer-events: none !important;\n  transition: background .15s ease !important;\n}'''),
              ('''        const cb = document.createElement("input");\n        cb.type = "checkbox";\n        cb.className = "adpb-switch-input";\n        cb.setAttribute("role", "switch");\n        cb.checked = on;\n        cb.setAttribute("aria-checked", on ? "true" : "false");\n        const track = document.createElement("span");\n        track.className = "adpb-toggle";\n        track.setAttribute("aria-hidden", "true");\n        lab.appendChild(text);\n        lab.appendChild(cb);\n        lab.appendChild(track);''', '''        const control = document.createElement("span");\n        control.className = "adpb-switch-control";\n        const cb = document.createElement("input");\n        cb.type = "checkbox";\n        cb.className = "adpb-switch-input";\n        cb.setAttribute("role", "switch");\n        cb.checked = on;\n        cb.setAttribute("aria-checked", on ? "true" : "false");\n        cb.setAttribute("aria-label", setting.displayName);\n        const track = document.createElement("span");\n        track.className = "adpb-toggle";\n        track.setAttribute("aria-hidden", "true");\n        control.appendChild(cb);\n        control.appendChild(track);\n        lab.appendChild(text);\n        lab.appendChild(control);'''),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected source fragment: {old[:100]!r}')
              text = text.replace(old, new, 1)

          migration = '''\n  // 0.1.32 one-time migration: make urgency, Subscribe & Save, recommendation\n  // carousels, and compact search opt-in for existing installations.\n  try {\n    if (GM_getValue("adpbMigrate032", true)) {\n      GM_setValue("removeUrgencyTactics", false);\n      GM_setValue("removeSubscribeNudges", false);\n      GM_setValue("removeFbtCarousels", false);\n      GM_setValue("compactSearchResults", false);\n      GM_setValue("adpbMigrate032", false);\n    }\n  } catch (e) {}\n'''
          anchor = '''  } catch (e) {}\n  // ============================================\n  // UTILITIES\n'''
          if anchor not in text:
              raise SystemExit('Migration insertion anchor not found')
          text = text.replace(anchor, '  } catch (e) {}\n' + migration + '  // ============================================\n  // UTILITIES\n', 1)

          old_block = '''        const cb = document.createElement("input");\n        cb.type = "checkbox";\n        cb.className = "adpb-switch-input";\n        cb.setAttribute("role", "switch");\n        cb.checked = on;\n        cb.setAttribute("aria-checked", on ? "true" : "false");\n        const track = document.createElement("span");\n        track.className = "adpb-toggle";\n        track.setAttribute("aria-hidden", "true");\n        lab.appendChild(text);\n        lab.appendChild(cb);\n        lab.appendChild(track);'''
          if text.count(old_block) != 0:
              raise SystemExit('Old switch block remained after replacement')

          script.write_text(text)

          readme = Path('README.md')
          readme.write_text('''# Amazon Dark Pattern Blocker\n\n<p align="center">\n  <img src="icon-128.png" width="128" height="128" alt="Amazon Dark Pattern Blocker icon" />\n</p>\n\n<p align="center">\n  Strip common Amazon dark patterns — Prime upsells, sponsored junk, Rufus, checkout nudges, and more — with a compact floating settings panel.\n</p>\n\n<p align="center">\n  <a href="https://github.com/ExtraPotions/velvet-crane-orbit/releases/latest"><img alt="Release" src="https://img.shields.io/github/v/release/ExtraPotions/velvet-crane-orbit?style=flat-square&label=release" /></a>\n  <a href="https://github.com/ExtraPotions/velvet-crane-orbit/releases"><img alt="Downloads" src="https://img.shields.io/github/downloads/ExtraPotions/velvet-crane-orbit/total?style=flat-square" /></a>\n  <a href="https://github.com/ExtraPotions/velvet-crane-orbit/stargazers"><img alt="Stars" src="https://img.shields.io/github/stars/ExtraPotions/velvet-crane-orbit?style=flat-square" /></a>\n  <a href="https://github.com/ExtraPotions/velvet-crane-orbit/network/members"><img alt="Forks" src="https://img.shields.io/github/forks/ExtraPotions/velvet-crane-orbit?style=flat-square" /></a>\n  <a href="https://github.com/ExtraPotions/velvet-crane-orbit/issues"><img alt="Issues" src="https://img.shields.io/github/issues/ExtraPotions/velvet-crane-orbit?style=flat-square" /></a>\n  <a href="https://creativecommons.org/licenses/by-nc/4.0/"><img alt="License: CC BY-NC 4.0" src="https://img.shields.io/badge/license-CC%20BY--NC%204.0-lightgrey?style=flat-square" /></a>\n</p>\n\n**Author:** [expDARE](https://github.com/ExtraPotions) · **Latest:** v0.1.32\n\n| Stat | Value |\n|------|-------|\n| Toggleable filters | **13** |\n| Userscript | `amazon-dark-pattern-blocker.user.js` |\n| Runs on | `.com` · `.co.uk` · `.ca` · `.de` · `.fr` · `.it` · `.es` · `.co.jp` · `.com.au` · `.in` · `.com.mx` · `.nl` |\n| Storage | `GM_getValue` / `GM_setValue` |\n| Managers | Violentmonkey (preferred), Tampermonkey, others |\n\n## Install\n\n1. Install [Violentmonkey](https://violentmonkey.github.io/) (preferred) or [Tampermonkey](https://www.tampermonkey.net/).\n2. Download **`amazon-dark-pattern-blocker.user.js`** from the [latest release](https://github.com/ExtraPotions/velvet-crane-orbit/releases/latest).\n3. Open the file (or drag it into the extension dashboard) and confirm install.\n4. Visit a supported Amazon storefront — enabled protections are applied automatically.\n5. Violentmonkey/Tampermonkey can auto-update from the GitHub release (`@downloadURL` / `@updateURL`).\n\n## What it blocks\n\n- Prime upsells and checkout interstitials\n- Sponsored products and ad shelves\n- Credit card and protection-plan upsells\n- Rufus / AI promo chrome\n- Amazon service and Business promos\n- Optional urgency / scarcity tactics\n- Optional Subscribe & Save nudges\n- Optional recommendation / frequently-bought-together carousels\n- Optional compact search-result spacing\n\n## Settings\n\nUse the 48×48 floating button on the right to open the settings panel. The button uses the existing project icon and now has a square, rounded shape. Settings are left-aligned and use accessible toggle switches. Changes apply live where the page supports live updates.\n\n### Default settings in v0.1.32\n\nThe following remain **enabled by default**:\n\n- Remove Prime upsells\n- Remove sponsored products\n- Remove credit card upsells\n- Remove Rufus AI\n- Remove Amazon service promos\n- Remove protection plans\n- Remove Amazon Business promos\n- Auto-clip coupons\n\nThe following are **opt-in and disabled by default**:\n\n- Remove urgency tactics\n- Remove Subscribe & Save nudges\n- Remove recommendation carousels\n- Compact search results\n- Remove homepage clutter\n\n### Existing installations\n\nUpgrading to v0.1.32 performs a one-time settings migration. It explicitly turns off urgency tactics, Subscribe & Save nudges, recommendation carousels, and compact search results so existing users receive the new opt-in defaults. The migration runs only once; subsequent changes are controlled by the user.\n\n## License\n\n[CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/) — Copyright (c) 2025–2026 **expDARE**. Attribution required. Non-commercial use only. Full text in [`LICENSE`](LICENSE).\n\n## Changelog\n\n### v0.1.32\n\n- Changed urgency tactics, Subscribe & Save nudges, recommendation carousels, and compact search to opt-in defaults.\n- Added a one-time migration for existing installations so those four settings reset to OFF during upgrade.\n- Fixed the floating settings switches so the actual controls receive pointer input.\n- Kept the existing icon unchanged.\n- Kept the floating button at 48×48px and changed its shape to a square with rounded corners.\n- Kept settings labels left-aligned and improved switch accessibility semantics.\n\nSee [GitHub Releases](https://github.com/ExtraPotions/velvet-crane-orbit/releases) for downloadable versions and notes.\n''')

          workflow = Path('.github/workflows/prepare-0.1.32.yml')
          workflow.unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon-dark-pattern-blocker.user.js README.md .github/workflows/prepare-0.1.32.yml
          git commit -m "release: v0.1.32 settings and UI fixes"
          git push
